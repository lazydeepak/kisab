name: RC sign

# Builds and signs a production-signed Kisab APK from the frozen v0.2.0
# release-candidate commit (no release tag, no GitHub Release).
#
# Trigger:
#   - repository_dispatch (event type `rc-signing-request`), normally emitted
#     by the secret-free `RC sign launcher` workflow, which provides the
#     "Run workflow" UI button. The launcher always dispatches the frozen
#     candidate SHA; this workflow independently asserts that equality before
#     any further processing.
#
# Frozen candidate: FROZEN_CANDIDATE_SHA (see the `env` block below) is the
# authoritative v0.2.0 RC-01 commit. Only that exact commit may be signed by
# this workflow. A typo, stale SHA, or another `main` commit that merely
# reports versionName 0.2.0 / versionCode 3 is rejected, even though it would
# satisfy the commit-exists and contained-in-origin/main checks.
#
# Trust anchor: for a `repository_dispatch` run GitHub sources this workflow
# from the default branch (main), sets GITHUB_REF and GITHUB_SHA to main, and
# only triggers the run if this file exists on main. A manual
# `workflow_dispatch` run can be started from a selected ref (Branch dropdown
# or `--ref`), so it is deliberately NOT used to reach signing secrets.
#
# Defense-in-depth (in addition to the main-only sourcing above):
#   - The `release-signing` GitHub Environment must be configured with
#     "Selected branches and tags" permitting only the branch `main`, no
#     tags, administrator bypass disabled, required reviewers enabled, and
#     self-review prevented where possible. GitHub evaluates these
#     deployment restrictions against the run's GITHUB_REF (main) before the
#     build-sign job can start or receive its secrets.
#   - The build-sign job also guards `github.ref == 'refs/heads/main'`.
#     This is not the primary control (a malicious workflow could remove
#     it); the environment policy and main-only sourcing are.
#   - main itself should be branch-protected (required PR review) so the
#     workflow source cannot be modified outside a reviewed pull request.
#
# Jobs:
#   - validate: NO environment and NO secrets. Only trusted workflow actions
#     plus Git object/file inspection. It does NOT run Gradle or any other
#     candidate-controlled build script, and provides no credential to
#     candidate code. It asserts that the dispatched payload equals the frozen
#     candidate SHA, that the SHA is a full 40-hex commit, that the commit
#     exists and is contained in origin/main, that the exact commit defines
#     appVersionName 0.2.0 / appVersionCode 3 (read via `git show`, not
#     executed), and that the v0.2.0 release notes exist in that exact commit
#     (checked via Git object inspection). Emits the validated IMMUTABLE commit
#     SHA as a job output; the SHA is never re-derived from the client payload
#     afterwards.
#   - build-sign: depends on validate, references the protected
#     `release-signing` environment, and checks out the VALIDATED IMMUTABLE
#     commit SHA (passed via job output). It re-reads the version from the
#     trusted checkout (compared against the validate job's inspection),
#     runs tests/lint/metadata validation from that trusted commit, decodes
#     the keystore only into $RUNNER_TEMP, signs, and verifies. Because it
#     depends on validate, no environment approval is ever requested for an
#     invalid, unmerged, or non-frozen candidate.
#
# No release tag is required or created. No GitHub Release is created.
#
# Signing secrets (KISAB_KEYSTORE_B64, KISAB_KEYSTORE_PASSWORD, KISAB_KEY_ALIAS,
# KISAB_KEY_PASSWORD) are environment-scoped and live in the protected
# `release-signing` GitHub Environment, gated by required approval. Values are
# never echoed; the decoded keystore exists only under $RUNNER_TEMP and is
# deleted automatically when the job ends.

on:
  repository_dispatch:
    types:
      - rc-signing-request

permissions:
  contents: read

env:
  # Frozen v0.2.1 release-candidate commit to sign (RC-03 / First Pilot OTA Target).
  # This exact commit is the ONLY candidate this workflow may sign; the payload must equal it.
  FROZEN_CANDIDATE_SHA: 18d5f5f2c89e12d090bf00f5f47031e3db6d40be

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      candidate_sha: ${{ steps.sha.outputs.candidate_sha }}
      candidate_short_sha: ${{ steps.sha.outputs.candidate_short_sha }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    permissions:
      contents: read
    steps:
      - name: Checkout default branch (trusted workflow source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Assert dispatched candidate is the frozen v0.2.0 candidate
        env:
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
        run: |
          if [ "$CANDIDATE_SHA" != "$FROZEN_CANDIDATE_SHA" ]; then
            echo "::error::Dispatched candidate_sha '$CANDIDATE_SHA' is not the frozen v0.2.0 candidate $FROZEN_CANDIDATE_SHA; refusing to sign."
            exit 1
          fi

      - name: Validate candidate SHA format and existence
        id: sha
        env:
          CANDIDATE_SHA: ${{ github.event.client_payload.candidate_sha }}
        run: |
          if ! [[ "$CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::candidate_sha must be a full 40-character hexadecimal commit SHA."
            exit 1
          fi
          if ! git cat-file -e "$CANDIDATE_SHA^{commit}" 2>/dev/null; then
            echo "::error::candidate_sha '$CANDIDATE_SHA' does not resolve to a commit."
            exit 1
          fi
          CANONICAL="$(git rev-parse "$CANDIDATE_SHA^{commit}")"
          echo "candidate_sha=${CANONICAL}" >> "$GITHUB_OUTPUT"
          echo "candidate_short_sha=${CANONICAL:0:12}" >> "$GITHUB_OUTPUT"

      - name: Verify candidate is contained in origin/main
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.candidate_sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$CANDIDATE_SHA" "refs/remotes/origin/main"; then
            echo "::error::Candidate $CANDIDATE_SHA is not contained in origin/main; refusing to sign an unreviewed commit."
            exit 1
          fi

      - name: Check out candidate and confirm immutability
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.candidate_sha }}
        run: |
          git checkout --detach "$CANDIDATE_SHA"
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "$CANDIDATE_SHA" ]; then
            echo "::error::Candidate SHA moved during validation (expected $CANDIDATE_SHA, HEAD is $HEAD_SHA); refusing to sign."
            exit 1
          fi

      - name: Inspect version metadata in candidate without executing build code
        id: version
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.candidate_sha }}
        run: |
          GRADLE_FILE="$(git show "$CANDIDATE_SHA:app/build.gradle.kts")"
          VERSION_NAME="$(printf '%s\n' "$GRADLE_FILE" | sed -n 's/^val appVersionName = "\([^"]*\)".*$/\1/p' | head -n1)"
          VERSION_CODE="$(printf '%s\n' "$GRADLE_FILE" | sed -n 's/^val appVersionCode = \([0-9][0-9]*\).*$/\1/p' | head -n1)"
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read appVersionName/appVersionCode from app/build.gradle.kts in the candidate."
            exit 1
          fi
          if [ "$VERSION_NAME" != "0.2.0" ] || [ "$VERSION_CODE" != "3" ]; then
            echo "::error::Candidate does not define the frozen v0.2.0 metadata (appVersionName=${VERSION_NAME} appVersionCode=${VERSION_CODE}); refusing to sign."
            exit 1
          fi
          {
            echo "version_name=${VERSION_NAME}"
            echo "version_code=${VERSION_CODE}"
          } >> "$GITHUB_OUTPUT"

      - name: Verify v0.2.0 release notes exist in candidate (Git object inspection)
        env:
          CANDIDATE_SHA: ${{ steps.sha.outputs.candidate_sha }}
        run: |
          if ! git cat-file -e "$CANDIDATE_SHA:docs/release/RELEASE_NOTES_0.2.0.md"; then
            echo "::error::Required release notes missing at docs/release/RELEASE_NOTES_0.2.0.md in candidate $CANDIDATE_SHA."
            exit 1
          fi

  build-sign:
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-signing
    outputs:
      candidate_sha: ${{ needs.validate.outputs.candidate_sha }}
      version_name: ${{ steps.version.outputs.version_name }}
      version_code: ${{ steps.version.outputs.version_code }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout validated candidate commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.candidate_sha }}
          fetch-depth: 0

      - name: Confirm checkout is the validated candidate
        run: |
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ "$HEAD_SHA" != "${{ needs.validate.outputs.candidate_sha }}" ]; then
            echo "::error::Checkout HEAD ${HEAD_SHA} does not match validated candidate ${{ needs.validate.outputs.candidate_sha }}."
            exit 1
          fi

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Run unit tests, lint, and release metadata validation
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KISAB_GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: ./gradlew :app:verifyLocal :app:verifyReleaseMetadata

      - name: Re-read version from candidate
        id: version
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KISAB_GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionInfo | sed -n 's/^versionName=//p')
          VERSION_CODE=$(./gradlew -q :app:printVersionInfo | sed -n 's/^versionCode=//p')
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::Could not read versionName/versionCode from the checked-out candidate."
            exit 1
          fi
          if [ "$VERSION_NAME" != "${{ needs.validate.outputs.version_name }}" ] || [ "$VERSION_CODE" != "${{ needs.validate.outputs.version_code }}" ]; then
            echo "::error::Version read mismatch between validate and build-sign (validate=${{ needs.validate.outputs.version_name }}/${{ needs.validate.outputs.version_code }}, build=$VERSION_NAME/$VERSION_CODE)."
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"

      - name: Set up release keystore
        env:
          KISAB_KEYSTORE_B64: ${{ secrets.KISAB_KEYSTORE_B64 }}
        run: |
          if [ -z "$KISAB_KEYSTORE_B64" ]; then
            echo "::error::KISAB_KEYSTORE_B64 secret is not set on the 'release-signing' environment; cannot sign."
            exit 1
          fi
          echo "$KISAB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kisab-release.keystore"

      - name: Assemble signed release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KISAB_GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          KISAB_KEYSTORE_PATH: ${{ runner.temp }}/kisab-release.keystore
          KISAB_KEYSTORE_PASSWORD: ${{ secrets.KISAB_KEYSTORE_PASSWORD }}
          KISAB_KEY_ALIAS: ${{ secrets.KISAB_KEY_ALIAS }}
          KISAB_KEY_PASSWORD: ${{ secrets.KISAB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease -Pkisab.privateUpdateManifestUrl="https://raw.githubusercontent.com/lazydeepak/kisab/main/docs/release/manifests/pilot-manifest.json"

      - name: Verify APK signing and record SHA-256 and certificate
        id: verify
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          # Public identity from the published v0.1.0 record
          # (docs/release/RELEASE_NOTES_0.1.0.md); not a secret. Guards signer
          # continuity: the candidate must reuse the existing production key.
          EXPECTED_CERT_SHA256: 92a578e8cedad6ea86d2dc27663a3279f07a70794627a280f877ab30b1f89cff
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced."
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$(basename "$APK")" > "$APK.sha256"
          CERT_SHA256=$("$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':\n' | tr 'A-F' 'a-f')
          if [ -z "$CERT_SHA256" ]; then
            echo "::error::Could not extract signer certificate SHA-256 from the APK."
            exit 1
          fi
          if [ "$CERT_SHA256" != "$EXPECTED_CERT_SHA256" ]; then
            echo "::error::Signer certificate SHA-256 ${CERT_SHA256} does not match the production v0.1.0 identity ${EXPECTED_CERT_SHA256}; refusing to upload."
            exit 1
          fi
          {
            echo "sha256=$SHA256"
            echo "cert_sha256=$CERT_SHA256"
            echo "apk=$APK"
          } >> "$GITHUB_OUTPUT"
          echo "candidate=$CANDIDATE_SHA apk=$(basename "$APK") sha256=$SHA256 cert_sha256=$CERT_SHA256"

      - name: Write non-secret evidence file
        id: evidence
        env:
          CANDIDATE_SHA: ${{ needs.validate.outputs.candidate_sha }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
          VERSION_CODE: ${{ steps.version.outputs.version_code }}
          APK_SHA256: ${{ steps.verify.outputs.sha256 }}
          CERT_SHA256: ${{ steps.verify.outputs.cert_sha256 }}
        run: |
          APK="${{ steps.verify.outputs.apk }}"
          SIZE=$(stat -c%s "$APK")
          RUN_ID="${GITHUB_RUN_ID}"
          jq -n \
            --arg candidateSha "$CANDIDATE_SHA" \
            --arg versionName "$VERSION_NAME" \
            --argjson versionCode "$VERSION_CODE" \
            --arg apkFileName "$(basename "$APK")" \
            --argjson apkSizeBytes "$SIZE" \
            --arg apkSha256 "$APK_SHA256" \
            --arg signerCertificateSha256 "$CERT_SHA256" \
            --arg verificationStatus "PASS" \
            --arg workflowRunId "$RUN_ID" \
            --arg purpose "kisab-v0.2.0-rc-sign" \
            '{schemaVersion:1, purpose:$purpose, candidateSha:$candidateSha, versionName:$versionName, versionCode:$versionCode, apkFileName:$apkFileName, apkSizeBytes:$apkSizeBytes, apkSha256:$apkSha256, signerCertificateSha256:$signerCertificateSha256, verificationStatus:$verificationStatus, workflowRunId:$workflowRunId}' \
            > evidence.json
          cat evidence.json

      - name: Upload signed APK, checksum, and evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kisab-v0.2.0-rc-${{ needs.validate.outputs.candidate_short_sha }}-signed-apk
          path: |
            app/build/outputs/apk/release/*-release.apk
            app/build/outputs/apk/release/*.sha256
            evidence.json
          if-no-files-found: error
