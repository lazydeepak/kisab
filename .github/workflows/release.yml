name: Release

# Builds and signs a Kisab release APK for an annotated `v<versionName>` tag.
#
# Trigger:
#   - manual workflow_dispatch with an existing annotated release tag name
#
# This workflow is deliberately NOT tag-triggered. For a `push` event GitHub
# sources the workflow from the pushed ref itself, so an unmerged tag could
# carry its own modified copy of this file and defeat the gate that this file
# enforces. `workflow_dispatch` is read from the default branch (main), so the
# workflow code is always the trusted, reviewed version. Automatic tag-push
# signing can be reconsidered later only with a trusted default-branch
# dispatcher or a strict `v*` tag ruleset that prevents non-reviewer pushes.
#
# Jobs:
#   - validate: NO environment and NO secrets. Only git operations. Resolves
#     the supplied tag, requires an annotated tag, peels it to a commit,
#     verifies that commit is contained in origin/main, and verifies the tag
#     still points at that commit. No code from the tag is executed.
#   - build-sign: depends on validate, references the protected
#     `release-signing` environment, and checks out the VALIDATED IMMUTABLE
#     commit SHA (passed via job output; the tag is never re-resolved). It
#     runs tests, lint, and version validation from that trusted commit, then
#     signs. Because it depends on validate, no environment approval is ever
#     requested for an invalid or unmerged tag.
#   - create-draft-release: depends on build-sign; creates a DRAFT GitHub
#     release at the validated tag (never auto-publishes).
#
# Signing secrets (KISAB_KEYSTORE_B64, KISAB_KEYSTORE_PASSWORD, KISAB_KEY_ALIAS,
# KISAB_KEY_PASSWORD) are environment-scoped and must live in the protected
# `release-signing` GitHub Environment, gated by required approval. Values are
# never echoed; the decoded keystore exists only under $RUNNER_TEMP and is
# deleted automatically when the job ends.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Annotated release tag to build and sign (e.g. v0.1.0). Must already exist and point to a commit contained in main.'
        required: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      release_tag: ${{ steps.resolve.outputs.tag }}
      commit_sha: ${{ steps.resolve.outputs.commit_sha }}
    permissions:
      contents: read
    steps:
      - name: Checkout default branch (trusted workflow source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Resolve release tag to an annotated commit
        id: resolve
        env:
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          git fetch origin tag "$DISPATCH_TAG"
          if [ "$(git cat-file -t "$DISPATCH_TAG")" != "tag" ]; then
            echo "::error::Tag '$DISPATCH_TAG' is not an annotated tag; refusing to sign."
            exit 1
          fi
          COMMIT_SHA=$(git rev-parse "$DISPATCH_TAG^{}")
          echo "commit_sha=${COMMIT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tag=${DISPATCH_TAG}" >> "$GITHUB_OUTPUT"

      - name: Verify tagged commit is contained in origin/main
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$COMMIT_SHA" "refs/remotes/origin/main"; then
            echo "::error::Tag '$RELEASE_TAG' points to commit $COMMIT_SHA which is not contained in origin/main; refusing to sign an unreviewed commit."
            exit 1
          fi

      - name: Verify tag still points at the validated commit
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          COMMIT_SHA: ${{ steps.resolve.outputs.commit_sha }}
        run: |
          CURRENT=$(git rev-parse "$RELEASE_TAG^{}")
          if [ "$CURRENT" != "$COMMIT_SHA" ]; then
            echo "::error::Tag '$RELEASE_TAG' moved during validation; refusing to sign."
            exit 1
          fi

  build-sign:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release-signing
    outputs:
      release_tag: ${{ steps.tag.outputs.tag }}
      version_name: ${{ steps.version.outputs.version_name }}
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout validated release commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.validate.outputs.commit_sha }}
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407

      - name: Install Android build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Create local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: Record release tag from validation
        id: tag
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.release_tag }}
        run: echo "tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests and lint
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KISAB_GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew :app:testDebugUnitTest
          ./gradlew :app:lintDebug

      - name: Read version from Android build config
        id: version
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KISAB_GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          VERSION_NAME=$(./gradlew -q :app:printVersionInfo | sed -n 's/^versionName=//p')
          if [ -z "$VERSION_NAME" ]; then
            echo "::error::Could not read versionName from the Android build config."
            exit 1
          fi
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Verify tag matches packaged versionName
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
          VERSION_NAME: ${{ steps.version.outputs.version_name }}
        run: |
          if [ "$RELEASE_TAG" != "v${VERSION_NAME}" ]; then
            echo "::error::Tag '$RELEASE_TAG' does not match packaged versionName 'v${VERSION_NAME}'; refusing to sign."
            exit 1
          fi

      - name: Set up release keystore
        env:
          KISAB_KEYSTORE_B64: ${{ secrets.KISAB_KEYSTORE_B64 }}
        run: |
          if [ -z "$KISAB_KEYSTORE_B64" ]; then
            echo "::error::KISAB_KEYSTORE_B64 secret is not set on the 'release-signing' environment; cannot sign a release."
            exit 1
          fi
          echo "$KISAB_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/kisab-release.keystore"

      - name: Assemble signed release APK
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.KISAB_GITHUB_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}
          KISAB_KEYSTORE_PATH: ${{ runner.temp }}/kisab-release.keystore
          KISAB_KEYSTORE_PASSWORD: ${{ secrets.KISAB_KEYSTORE_PASSWORD }}
          KISAB_KEY_ALIAS: ${{ secrets.KISAB_KEY_ALIAS }}
          KISAB_KEY_PASSWORD: ${{ secrets.KISAB_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify APK signing and record SHA-256
        id: verify
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: |
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*-release.apk' -print -quit)
          if [ -z "$APK" ]; then
            echo "::error::No release APK produced."
            exit 1
          fi
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          SHA256=$(sha256sum "$APK" | awk '{print $1}')
          printf '%s  %s\n' "$SHA256" "$(basename "$APK")" > "$APK.sha256"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Release ${RELEASE_TAG} APK SHA-256: ${SHA256}"

      - name: Upload signed APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: kisab-${{ steps.tag.outputs.tag }}-signed-apk
          path: |
            app/build/outputs/apk/release/*-release.apk
            app/build/outputs/apk/release/*.sha256

  create-draft-release:
    needs: build-sign
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout default branch (for release notes)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Download signed APK and checksum
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: kisab-${{ needs.build-sign.outputs.release_tag }}-signed-apk
          path: dist/

      - name: Prepare version-aware release body
        id: body
        env:
          VERSION_NAME: ${{ needs.build-sign.outputs.version_name }}
        run: |
          NOTES="docs/release/RELEASE_NOTES_${VERSION_NAME}.md"
          if [ -f "$NOTES" ]; then
            cp "$NOTES" release-body.md
            echo "Using release notes: $NOTES"
          else
            echo "::warning::No release notes found at $NOTES; the draft release body will be empty."
            : > release-body.md
          fi

      # Draft only: an owner must review and explicitly publish the release.
      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ needs.build-sign.outputs.release_tag }}
          name: Kisab ${{ needs.build-sign.outputs.release_tag }}
          body_path: release-body.md
          draft: true
          files: dist/*
